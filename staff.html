<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1a35">
<title>HBC Staff</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a1a35'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='900' text-anchor='middle' fill='%236fb4ea'%3EHBC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#0a1a35; --ice:#6fb4ea; --gold:#f5b800; --green:#3fae6a; --red:#c4473d;
  --bg:#e8f2fa; --bg2:#d6e6f3; --text:#0a1a35; --muted:#4a5f78; --card:#fff; --line:#bcd0e2;
  --head:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#0c1830;--bg2:#10264a;--text:#e8f2fa;--muted:#9fb4c9;--card:#142a4f;--line:#26406a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--head);font-style:italic;font-weight:800;line-height:1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.top{background:var(--navy);color:#e8f2fa;padding:calc(.75rem + env(safe-area-inset-top,0px)) 1rem .75rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.top .logo{font:800 italic 1.6rem/1 var(--head)}
.top .logo b{color:var(--ice)}
.top .sp{flex:1}
.top button,.top a{background:transparent;color:#e8f2fa;border:1px solid #6fb4ea88;border-radius:.3rem;padding:.4rem .7rem;font:500 .9rem var(--body);cursor:pointer;text-decoration:none}
.wrap{max-width:62rem;margin:0 auto;padding:1rem}
.btn{display:inline-block;background:var(--ice);color:var(--navy);font:800 italic 1.15rem/1 var(--head);padding:.8rem 1.2rem;border:0;border-radius:.3rem;cursor:pointer;text-decoration:none}
.btn.sm{font-size:1rem;padding:.55rem .8rem}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--ice)}
.btn.bad{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn:disabled{opacity:.5;cursor:default}
/* login */
#login{max-width:22rem;margin:3rem auto;background:var(--card);border:1px solid var(--line);border-radius:.3rem;padding:1.5rem;display:grid;gap:1rem}
#login h1{font-size:2rem}
label{display:grid;gap:.3rem;font-weight:600;font-size:.95rem}
input[type=text],input[type=password],input[type=search]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:.25rem;padding:.7rem .8rem;width:100%}
.err{color:var(--red);font-weight:600;margin:0;min-height:1.4em}
/* tabs */
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.75rem 1rem;background:var(--bg2);position:sticky;top:0;z-index:5}
.tabs button{flex:0 0 auto;border:2px solid transparent;background:var(--card);color:var(--text);font:600 .95rem var(--body);padding:.5rem .85rem;border-radius:.3rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ice);color:var(--navy)}
.tabs .n{display:inline-block;min-width:1.4rem;text-align:center;background:var(--navy);color:#e8f2fa;border-radius:1rem;font-size:.8rem;padding:0 .35rem;margin-left:.3rem}
/* filters + cards */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.filters button{border:2px solid var(--line);background:var(--card);color:var(--text);padding:.35rem .7rem;border-radius:2rem;font:500 .9rem var(--body);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#e8f2fa}
.list{display:grid;gap:.75rem}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ice);border-radius:.25rem;padding:.9rem 1rem}
.card.s-New{border-left-color:var(--gold)}
.card.s-Confirmed{border-left-color:var(--green)}
.card.s-Done{border-left-color:#8a99a8;opacity:.8}
.card.s-Cancelled{border-left-color:var(--red);opacity:.65}
.card h3{font-size:1.45rem;margin-bottom:.15rem}
.card .when{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.35rem 0}
.tag{font-size:.78rem;font-weight:600;border-radius:.2rem;padding:.1rem .45rem;background:var(--bg2);color:var(--text)}
.tag.snow{background:var(--gold);color:#0a1a35}
.tag.rec{background:var(--green);color:#fff}
.tag.st{background:var(--navy);color:#e8f2fa}
.meta{color:var(--muted);font-size:.92rem;margin:.1rem 0}
.meta a{color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.empty{color:var(--muted);padding:1.5rem 0}
/* calendar */
.cal{max-width:34rem}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.cal-head strong{font:800 italic 1.6rem/1 var(--head)}
.cal-head button{width:2.6rem;height:2.6rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:.3rem;font-size:1.2rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}
.grid .dow{font-size:.75rem;text-align:center;color:var(--muted);font-weight:600}
.grid button{min-height:3.2rem;border:2px solid transparent;border-radius:.3rem;background:var(--card);color:var(--text);font:500 .95rem var(--body);cursor:pointer;padding:.2rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.1rem}
.grid button .c{font-size:.75rem;font-weight:700;border-radius:1rem;padding:0 .4rem;background:var(--green);color:#fff}
.grid button .c.new{background:var(--gold);color:#0a1a35}
.grid button.today{border-color:var(--line)}
.grid button[aria-pressed=true]{background:var(--ice);color:var(--navy)}
.day{margin-top:1rem}
.day h2{font-size:1.6rem;margin-bottom:.6rem}
/* map */
#mapbox{height:68vh;min-height:20rem;border:2px solid var(--ice);border-radius:.3rem;background:var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:1rem;margin:.6rem 0;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.35rem;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#e8f2fa;padding:.6rem 1rem;border-radius:.3rem;z-index:20;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <span class="logo"><b>HBC</b> Staff</span>
  <span class="sp"></span>
  <span id="who" hidden></span>
  <a id="sheet" href="#" target="_blank" rel="noopener" hidden>Spreadsheet</a>
  <button type="button" id="refresh" hidden>Refresh</button>
  <button type="button" id="logout" hidden>Log out</button>
</header>

<form id="login" autocomplete="on">
  <h1>Staff login</h1>
  <label>Name<input type="text" id="u" name="username" autocomplete="username" required></label>
  <label>Password<input type="password" id="p" name="password" autocomplete="current-password" required></label>
  <p class="err" id="lerr" role="alert"></p>
  <button class="btn" type="submit" id="lbtn">Log in</button>
</form>

<div id="app" hidden>
  <nav class="tabs" role="tablist" aria-label="Dashboard sections">
    <button role="tab" data-tab="req" aria-selected="true">Requests<span class="n" id="n-req">0</span></button>
    <button role="tab" data-tab="cal" aria-selected="false">Calendar</button>
    <button role="tab" data-tab="map" aria-selected="false">Map</button>
    <button role="tab" data-tab="snow" aria-selected="false">Next snow<span class="n" id="n-snow">0</span></button>
    <button role="tab" data-tab="rec" aria-selected="false">Recurring<span class="n" id="n-rec">0</span></button>
  </nav>
  <main class="wrap">
    <section id="t-req">
      <div class="filters" id="filters"></div>
      <div class="list" id="l-req"></div>
    </section>
    <section id="t-cal" hidden>
      <div class="cal">
        <div class="cal-head"><button type="button" id="prev" aria-label="Previous month">‹</button><strong id="mtitle"></strong><button type="button" id="next" aria-label="Next month">›</button></div>
        <div class="grid" id="grid"></div>
        <p class="meta" style="margin-top:.6rem"><span class="tag">Gold = has a new request</span> <span class="tag">Green = all confirmed</span></p>
      </div>
      <div class="day" id="day"></div>
    </section>
    <section id="t-map" hidden>
      <div class="legend">
        <span><i style="background:#6fb4ea"></i>Scheduled</span>
        <span><i style="background:#f5b800"></i>Next snow</span>
        <span><i style="background:#3fae6a"></i>Every snowfall</span>
      </div>
      <div id="mapbox"></div>
      <p class="meta" id="mapnote"></p>
    </section>
    <section id="t-snow" hidden>
      <p class="meta">People waiting for us to come after the next snowfall.</p>
      <div class="list" id="l-snow"></div>
    </section>
    <section id="t-rec" hidden>
      <p class="meta">Customers who want us out every snowfall this season.</p>
      <div class="list" id="l-rec"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  // Same Google Apps Script address the website's booking form uses.
  var SCRIPT_URL='https://script.google.com/macros/s/AKfycbyuWFz_sudYj0NptSm1x7Aomgu08pTzaCWUrOmQhRzfIz4eX_tiK1yC_p6sP2oZtrLalg/exec';

  var $=function(id){return document.getElementById(id);};
  var rows=[],creds=null,tab='req',filter='open',view=firstOfMonth(new Date()),selDay=null,map=null,layer=null;
  var mnLong=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function pad(n){return String(n).padStart(2,'0');}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2500);}

  function isActive(r){return r.status!=='Cancelled'&&r.status!=='Done';}
  function isNext(r){return !r.date;}
  function isRec(r){return /every snowfall/i.test(r.freq);}

  /* ---------- API ---------- */
  function api(action,extra){
    var body=Object.assign({action:action,name:creds.name,password:creds.password},extra||{});
    return fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
      .then(function(r){return r.json();});
  }

  /* ---------- login ---------- */
  function showApp(on){
    $('login').hidden=on;$('app').hidden=!on;
    ['logout','refresh'].forEach(function(i){$(i).hidden=!on;});
    $('who').hidden=!on;
  }
  function load(quiet){
    return api('list').then(function(res){
      if(!res.ok){throw new Error(res.error||'Could not load.');}
      rows=res.rows||[];
      $('who').textContent=res.name;
      if(res.sheetUrl){$('sheet').href=res.sheetUrl;$('sheet').hidden=false;}
      showApp(true);renderAll();
      if(!quiet)toast('Updated');
    });
  }
  $('login').addEventListener('submit',function(e){
    e.preventDefault();
    creds={name:$('u').value.trim(),password:$('p').value};
    $('lerr').textContent='';$('lbtn').disabled=true;$('lbtn').textContent='Checking…';
    load(true).then(function(){
      try{sessionStorage.setItem('hbc_staff',JSON.stringify(creds));}catch(x){}
      $('p').value='';
    }).catch(function(err){
      creds=null;$('lerr').textContent=err.message==='Failed to fetch'?'Could not reach the server. Check your connection.':err.message;
    }).then(function(){$('lbtn').disabled=false;$('lbtn').textContent='Log in';});
  });
  $('logout').onclick=function(){
    try{sessionStorage.removeItem('hbc_staff');}catch(x){}
    creds=null;rows=[];showApp(false);
  };
  $('refresh').onclick=function(){load().catch(function(e){toast(e.message);});};
  try{var saved=sessionStorage.getItem('hbc_staff');if(saved){creds=JSON.parse(saved);load(true).catch(function(){creds=null;showApp(false);});}}catch(x){}
  setInterval(function(){if(creds&&!document.hidden)load(true).catch(function(){});},60000);

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){setTab(b.getAttribute('data-tab'));};
  });
  function setTab(t){
    tab=t;
    document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===t?'true':'false');});
    ['req','cal','map','snow','rec'].forEach(function(k){$('t-'+k).hidden=k!==t;});
    if(t==='map')renderMap();
  }

  /* ---------- cards ---------- */
  function setStatus(r,status,btn){
    btn.disabled=true;
    api('update',{id:r.id,status:status}).then(function(res){
      if(!res.ok)throw new Error(res.error||'Update failed');
      r.status=status;toast(r.name+': '+status);return load(true);
    }).catch(function(e){toast(e.message);btn.disabled=false;});
  }
  function card(r,opts){
    var c=el('article','card s-'+r.status);
    c.appendChild(el('h3',null,r.name));
    c.appendChild(el('div','when',r.when||(r.date||'')));
    var tags=el('div','tags');
    tags.appendChild(el('span','tag st',r.status));
    if(isNext(r))tags.appendChild(el('span','tag snow','Next snow'));
    if(isRec(r))tags.appendChild(el('span','tag rec','Every snowfall'));
    tags.appendChild(el('span','tag',r.svc));
    c.appendChild(tags);
    var m=el('div','meta');
    var a=el('a',null,r.addr);a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.addr);a.target='_blank';a.rel='noopener';
    m.appendChild(a);c.appendChild(m);
    var ph=el('div','meta');
    var call=el('a',null,r.phone);call.href='tel:'+r.phone.replace(/[^\d+]/g,'');
    var txt=el('a',null,'Text');txt.href='sms:'+r.phone.replace(/[^\d+]/g,'');
    ph.appendChild(call);ph.appendChild(document.createTextNode(' · '));ph.appendChild(txt);c.appendChild(ph);
    if(r.notes)c.appendChild(el('div','meta','Notes: '+r.notes));
    var foot=['Requested '+fmtCreated(r.created)];
    if(r.updatedBy)foot.push(r.status+' by '+r.updatedBy);
    c.appendChild(el('div','meta',foot.join(' · ')));
    if(!opts||!opts.noActions){
      var acts=el('div','acts');
      function add(label,status,cls){var b=el('button','btn sm '+(cls||''),label);b.type='button';b.onclick=function(){setStatus(r,status,b);};acts.appendChild(b);}
      if(r.status==='New'){add('Confirm','Confirmed');add('Cancel','Cancelled','bad');}
      else if(r.status==='Confirmed'){add('Mark done','Done');add('Back to new','New','alt');add('Cancel','Cancelled','bad');}
      else{add('Reopen','New','alt');}
      c.appendChild(acts);
    }
    return c;
  }
  function fmtCreated(s){var d=new Date(s);return isNaN(d)?s:(d.getMonth()+1)+'/'+d.getDate()+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
  function fill(listEl,items,emptyText,opts){
    listEl.innerHTML='';
    if(!items.length){listEl.appendChild(el('p','empty',emptyText));return;}
    items.forEach(function(r){listEl.appendChild(card(r,opts));});
  }
  function sortRows(a,b){
    var da=a.date||'9999',db=b.date||'9999';
    if(da!==db)return da<db?-1:1;
    return (a.startHour||0)-(b.startHour||0)||(a.created<b.created?1:-1);
  }

  /* ---------- render ---------- */
  function renderAll(){
    var open=rows.filter(function(r){return r.status==='New'||r.status==='Confirmed';});
    $('n-req').textContent=open.length;
    $('n-snow').textContent=rows.filter(function(r){return isActive(r)&&isNext(r);}).length;
    $('n-rec').textContent=rows.filter(function(r){return isActive(r)&&isRec(r);}).length;
    renderRequests();renderCal();renderLists();
    if(tab==='map')renderMap();
  }
  function renderRequests(){
    var f=[['open','Open'],['New','New'],['Confirmed','Confirmed'],['Done','Done'],['Cancelled','Cancelled'],['all','All']];
    var box=$('filters');box.innerHTML='';
    f.forEach(function(x){
      var count=rows.filter(function(r){return match(r,x[0]);}).length;
      var b=el('button',null,x[1]+' ('+count+')');b.type='button';b.setAttribute('aria-pressed',filter===x[0]?'true':'false');
      b.onclick=function(){filter=x[0];renderRequests();};box.appendChild(b);
    });
    var list=rows.filter(function(r){return match(r,filter);}).sort(sortRows);
    fill($('l-req'),list,'No requests here yet.');
  }
  function match(r,f){
    if(f==='all')return true;
    if(f==='open')return r.status==='New'||r.status==='Confirmed';
    return r.status===f;
  }
  function renderLists(){
    fill($('l-snow'),rows.filter(function(r){return isActive(r)&&isNext(r);}).sort(function(a,b){return a.created<b.created?-1:1;}),'Nobody is waiting on the next snowfall.');
    fill($('l-rec'),rows.filter(function(r){return isActive(r)&&isRec(r);}).sort(function(a,b){return a.name<b.name?-1:1;}),'No every-snowfall customers yet.');
  }

  /* ---------- calendar ---------- */
  $('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal();};
  $('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal();};
  function renderCal(){
    $('mtitle').textContent=mnLong[view.getMonth()]+' '+view.getFullYear();
    var g=$('grid');g.innerHTML='';
    dn.forEach(function(n){g.appendChild(el('div','dow',n));});
    for(var i=0;i<view.getDay();i++)g.appendChild(el('span'));
    var days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),todayIso=iso(new Date());
    var byDay={};
    rows.forEach(function(r){if(r.date&&r.status!=='Cancelled'){(byDay[r.date]=byDay[r.date]||[]).push(r);}});
    for(var n=1;n<=days;n++){
      var d=new Date(view.getFullYear(),view.getMonth(),n),k=iso(d),list=byDay[k]||[];
      var b=el('button',k===todayIso?'today':'');b.type='button';
      b.appendChild(document.createTextNode(n));
      if(list.length){
        var hasNew=list.some(function(r){return r.status==='New';});
        b.appendChild(el('span','c'+(hasNew?' new':''),String(list.length)));
      }
      b.setAttribute('aria-pressed',selDay===k?'true':'false');
      b.setAttribute('aria-label',dn[d.getDay()]+', '+mnLong[d.getMonth()]+' '+n+(list.length?', '+list.length+' booked':''));
      (function(key){b.onclick=function(){selDay=key;renderCal();};})(k);
      g.appendChild(b);
    }
    var box=$('day');box.innerHTML='';
    if(selDay){
      var p=selDay.split('-'),dd=new Date(+p[0],+p[1]-1,+p[2]);
      box.appendChild(el('h2',null,dn[dd.getDay()]+', '+mnLong[dd.getMonth()]+' '+dd.getDate()));
      var items=(byDay[selDay]||[]).slice().sort(sortRows);
      var l=el('div','list');box.appendChild(l);
      fill(l,items,'Nothing booked this day.');
    }
  }

  /* ---------- map ---------- */
  function renderMap(){
    var note=$('mapnote');
    if(!window.L){note.textContent='The map could not load. Check your connection and refresh.';return;}
    if(!map){
      map=L.map('mapbox').setView([42.6728,-88.5445],12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    }
    setTimeout(function(){map.invalidateSize();},50);
    if(layer)layer.remove();
    layer=L.layerGroup().addTo(map);
    var pts=[],missing=0;
    rows.filter(isActive).forEach(function(r){
      if(r.lat==null||r.lng==null){missing++;return;}
      var color=isRec(r)?'#3fae6a':isNext(r)?'#f5b800':'#6fb4ea';
      var m=L.circleMarker([r.lat,r.lng],{radius:9,color:'#0a1a35',weight:2,fillColor:color,fillOpacity:.95}).addTo(layer);
      var pop=document.createElement('div');
      pop.appendChild(el('strong',null,r.name));pop.appendChild(document.createElement('br'));
      pop.appendChild(document.createTextNode(r.when));pop.appendChild(document.createElement('br'));
      pop.appendChild(document.createTextNode(r.addr));pop.appendChild(document.createElement('br'));
      var a=el('a',null,'Directions');a.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(r.addr);a.target='_blank';a.rel='noopener';
      pop.appendChild(a);
      m.bindPopup(pop);
      pts.push([r.lat,r.lng]);
    });
    if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15});
    note.textContent=(pts.length?pts.length+' open jobs on the map. ':'No open jobs to show. ')+(missing?missing+' could not be placed (check the address).':'');
  }
})();
</script>
</body>
</html>
